        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #f8f7f5;
            color: #2a2a2a;
            line-height: 1.6;
        }

        main {
            max-width: 600px;
            margin: 0 auto;
            padding: 2rem 1.5rem 3rem;
            min-height: 100vh;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            letter-spacing: -0.02em;
        }

        .bio {
            color: #5c5c5c;
            font-size: 1rem;
            max-width: 46ch;
            margin-bottom: 1.25rem;
        }

        .socials {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem 1.25rem;
            margin-bottom: 2.5rem;
        }

        .socials a {
            color: #5c5c5c;
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: underline;
            text-decoration-color: #d5d3cf;
            text-underline-offset: 3px;
        }

        .socials a:hover {
            color: #2a2a2a;
            text-decoration-color: #2a2a2a;
        }

        nav {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        @media (min-width: 640px) {
            main {
                max-width: 760px;
            }

            nav {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 1.25rem;
            }
        }

        @media (min-width: 1024px) {
            main {
                max-width: 1180px;
            }

            .card-label {
                padding: 1.5rem 1.75rem;
                font-size: 1.25rem;
            }
        }

        .card {
            display: block;
            background-color: white;
            color: #2a2a2a;
            text-decoration: none;
            border-radius: 8px;
            border: 1px solid #e5e5e5;
            overflow: hidden;
            transition: border-color 0.2s ease;
        }

        .card:active {
            border-color: #2a2a2a;
        }

        @media (hover: hover) {
            .card:hover {
                border-color: #2a2a2a;
            }
        }

        .card:hover .card-label,
        .card:active .card-label {
            background-color: #f0f0f0;
        }

        .vignette {
            position: relative;
            aspect-ratio: 5 / 2;
            overflow: hidden;
        }

        .vignette svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .card-label {
            padding: 1.25rem 1.5rem;
            font-size: 1.125rem;
            font-weight: 500;
            transition: background-color 0.2s ease;
        }

        .card-sub {
            display: block;
            margin-top: 0.2rem;
            font-size: 0.8125rem;
            font-weight: 400;
            color: #8a8a8a;
        }

        /* ---- Meridian GP vignette ---- */
        .vignette-mgp {
            background: #070707;
        }

        /* ---- Scoville vignette ---- */
        .vignette-scoville {
            background:
                radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.5), transparent 60%),
                radial-gradient(1px 1px at 25% 65%, rgba(255,255,255,0.35), transparent 60%),
                radial-gradient(1px 1px at 40% 15%, rgba(255,255,255,0.45), transparent 60%),
                radial-gradient(1px 1px at 55% 80%, rgba(255,255,255,0.3), transparent 60%),
                radial-gradient(1px 1px at 70% 35%, rgba(255,255,255,0.5), transparent 60%),
                radial-gradient(1px 1px at 82% 60%, rgba(255,255,255,0.35), transparent 60%),
                radial-gradient(1px 1px at 15% 85%, rgba(255,255,255,0.4), transparent 60%),
                radial-gradient(1px 1px at 90% 15%, rgba(255,255,255,0.45), transparent 60%),
                radial-gradient(1px 1px at 60% 55%, rgba(255,255,255,0.3), transparent 60%),

                radial-gradient(1px 1px at 78% 85%, rgba(255,255,255,0.3), transparent 60%),
                radial-gradient(1px 1px at 5% 50%, rgba(255,255,255,0.35), transparent 60%),
                radial-gradient(120% 160% at 68% 28%, #170B33 0%, #0B0518 55%, #07030F 100%);
        }

        .sc-legend {
            position: absolute;
            left: 12px;
            bottom: 12px;
            width: 40px;
            height: 3px;
            border-radius: 2px;
            background: linear-gradient(90deg, #38BDF8, #818CF8, #E879F9, #FB7185, #FDBA74);
        }

        .sc-word {
            position: absolute;
            left: 12px;
            top: 10px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.04em;
            background: linear-gradient(100deg, #38BDF8, #E879F9 55%, #FDBA74);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        @media (prefers-reduced-motion: reduce) {
            .orbit {
                animation: none !important;
            }
        }

        footer.author {
            margin-top: 2.5rem;
            text-align: center;
        }

        footer.author a {
            color: #8a8a8a;
            font-size: 0.8125rem;
            text-decoration: none;
            letter-spacing: 0.02em;
        }

        footer.author a:hover {
            color: #2a2a2a;
            text-decoration: underline;
        }

    <script>
      (function () {
        var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        function setSvgPlaying(vignette, playing) {
          var svg = vignette.querySelector('svg');
          if (!svg || typeof svg.pauseAnimations !== 'function') return;
          if (playing) svg.unpauseAnimations(); else svg.pauseAnimations();
        }

        var vignettes = document.querySelectorAll('.vignette');
        vignettes.forEach(function (v) { setSvgPlaying(v, false); });

        if (reduceMotion) return; // leave everything paused/static

        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            var v = entry.target;
            var playing = entry.isIntersecting && !document.hidden;
            v.classList.toggle('animate', playing);
            setSvgPlaying(v, playing);
          });
        }, { threshold: 0.2 });
        vignettes.forEach(function (v) { io.observe(v); });

        document.addEventListener('visibilitychange', function () {
          document.body.classList.toggle('page-hidden', document.hidden);
          vignettes.forEach(function (v) {
            setSvgPlaying(v, !document.hidden && v.classList.contains('animate'));
          });
        });
      })();
    </script>
