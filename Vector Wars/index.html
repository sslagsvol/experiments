<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04051a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Vector Wars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%2304051a%27/%3E%3Cpath d=%27M16 5 27 16 16 27 5 16Z%27 fill=%27none%27 stroke=%27%2346d2ff%27 stroke-width=%273%27/%3E%3C/svg%3E">
<!-- Google Analytics (GA4) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-WZGPQSX3XJ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-WZGPQSX3XJ');
</script>
</head>
<body>
<canvas id="game"></canvas>
<div id="danger"></div>

<div id="hud">
  <div id="dist"><span id="score">0</span><span id="rank-badge"></span></div>
  <div id="best">Best 0</div>
  <button id="mute" type="button" aria-label="Mute sound" aria-pressed="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9h4l5-4v14l-5-4H4z"/><path class="on" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/><path class="x" d="M16 9l5 6M21 9l-5 6"/></svg>
  </button>
  <button id="pause-btn" type="button" aria-label="Pause">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>
  </button>
  <div id="army-hud"><div id="gain" class="delta"></div><div id="count">0</div><div id="loss" class="delta"></div></div>
  <div id="debug"></div>
</div>

<div id="title" class="overlay">
  <div class="title-stage">
    <div id="title-logo">
      <h1>Vector Wars</h1>
      <p class="sub">Drag to steer · Shoot gates to raise them</p>
    </div>
    <div id="title-board"></div>
  </div>
  <p class="blink">Touch to start</p>
</div>

<div id="over" class="overlay hidden">
  <h2>Swarm lost</h2>
  <div id="recap" class="recap"></div>
  <div id="entry" class="hidden"></div>
  <p id="retry" class="blink">Tap to retry</p>
</div>

<div id="pause" class="overlay hidden">
  <h1 class="paused">Paused</h1>
  <div class="pause-tabs" role="tablist">
    <button type="button" data-tab="run" class="on">This run</button>
    <button type="button" data-tab="board">High scores</button>
  </div>
  <div class="pause-body">
    <div id="pause-recap" class="recap"></div>
    <div class="pause-board"><div id="pause-board"></div><div id="pause-pace"></div></div>
  </div>
  <div class="pause-actions">
    <button id="resume" type="button" class="btn primary">Continue</button>
    <button id="restart" type="button" class="btn">Restart</button>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
