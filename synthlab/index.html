<body>
<div class="app">
  <section class="stage" aria-label="Instrument">
    <header class="bar">
      <h1>Synthlab</h1>
      <span class="pill" id="audio-state" role="status">Tap a key to enable sound</span>
      <button type="button" id="tweaks-toggle" aria-pressed="true">Tweaks</button>
    </header>
    <div class="strip" id="strip" role="group" aria-label="Samples"></div>
    <div class="kb" id="kb" role="group" aria-label="Keyboard"></div>
  </section>
  <aside class="panel" id="panel" aria-label="Tweaks"></aside>
</div>
<noscript><p style="padding:16px">Synthlab needs JavaScript.</p></noscript>
<script type="module" src="src/main.js"></script>
